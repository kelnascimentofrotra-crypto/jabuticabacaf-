    <rect x="42" y="52" width="116" height="40" rx="14" fill="url(#body)" stroke="#0B2E59" stroke-width="5"/>
    <rect x="52" y="78" width="96" height="7" rx="3.5" fill="#1E9BE0"/>
    <circle cx="140" cy="65" r="4" fill="#E02B28"/>
    <path d="M56 64h44" stroke="#0B2E59" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- fluxo de ar gelado -->
