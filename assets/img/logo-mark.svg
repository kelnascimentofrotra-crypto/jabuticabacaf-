  </defs>

  <circle cx="100" cy="100" r="96" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#E02B28" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round" opacity=".7"/>

  <!-- split / condicionador -->
