<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel administrativo — SMUG MODAS</title>
<script src="theme.js"></script>
<meta name="theme-color" content="#f7f3ec">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preload" href="../assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="admin.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Pular para o conteúdo</a>

<!-- Entrada: formulário à esquerda, foto da loja à direita -->
<div data-login hidden></div>

<div class="shell" data-app hidden>
  <aside class="side" id="side" aria-label="Menu do painel">
    <a class="side-brand" href="#/inicio" aria-label="Início do painel" data-brand></a>
    <nav class="side-nav" data-nav></nav>
    <a class="side-site" href="../?atualizado=1" target="_blank" rel="noopener" data-site-link></a>
  </aside>
  <div class="side-shade" data-close-drawer></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn top-menu" type="button" aria-label="Abrir menu" aria-controls="side" aria-expanded="false" data-menu></button>
      <a class="top-name" href="#/inicio" aria-label="Início do painel" data-brand></a>
      <button class="btn icon-btn theme-btn" type="button" data-theme-btn></button>
      <a class="top-user" href="#/conta" title="Minha conta e senha">
        <span class="avatar" aria-hidden="true" data-avatar></span>
        <span class="top-who"><b>Administrador</b><small data-email></small></span>
      </a>
      <button class="btn btn-ghost top-out" type="button" data-logout></button>
    </header>
    <main class="page" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="boot" data-boot role="status"><span class="spinner" aria-hidden="true"></span><span>Carregando painel…</span></div>
<div class="toasts" aria-live="polite" data-toasts></div>
<dialog class="modal" data-modal></dialog>
<noscript><p class="noscript">O painel precisa do JavaScript ativado.</p></noscript>
</body>
</html>
