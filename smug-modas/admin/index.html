<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#160D09">
<title>Painel — SMUG MODAS</title>
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preload" href="../assets/fonts/playfair-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
<script type="module" src="app.js"></script>
</head>
<body class="admin">
<a class="skip-link" href="#main">Pular para o conteúdo</a>

<!-- Entrada: a mesma abertura (hero) do site, com o acesso num painel de vidro -->
<section class="hero login-hero" data-login hidden aria-labelledby="login-title">
  <div class="hero__bg" aria-hidden="true">
    <div class="hero__bg-layer"><img class="hero__bg-img" src="../assets/img/hero-fundo.webp" width="1600" height="853" alt="" fetchpriority="high"></div>
    <span class="hero__sun"></span>
  </div>
  <div class="hero__stage" aria-hidden="true">
    <p class="hero__brand"><span class="hero__brand-word"><span class="hero__letter" style="--li:0">S</span><span class="hero__letter" style="--li:1">M</span><span class="hero__letter" style="--li:2">U</span><span class="hero__letter" style="--li:3">G</span></span></p>
    <figure class="hero__figure"><img class="hero__photo" src="../assets/img/fabielly-hero.webp" width="531" height="971" alt=""></figure>
  </div>
  <span class="hero__vignette" aria-hidden="true"></span>
  <div class="login-card" data-login-card></div>
</section>

<div class="app" data-app hidden>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="logo" href="#/inicio" aria-label="SMUG MODAS — início do painel">
        <span class="logo__mark" aria-hidden="true">S</span>
        <span class="logo__rule" aria-hidden="true"></span>
        <span class="logo__type" aria-hidden="true"><span class="logo__name">SMUG</span><span class="logo__sub">MODAS</span></span>
      </a>
      <nav class="app-nav" aria-label="Painel" data-nav></nav>
      <div class="app-header__actions">
        <a class="app-action" href="../?atualizado=1" target="_blank" rel="noopener" data-site-link>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg><span>Ver site</span>
        </a>
        <button class="app-action" type="button" data-logout>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg><span>Sair</span>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="app-main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Painel (atalhos)" data-tabbar></nav>
</div>

<div class="boot" data-boot role="status"><span class="boot__mark" aria-hidden="true">S</span><span>Carregando o painel…</span></div>
<div class="toasts" aria-live="polite" data-toasts></div>
<dialog class="modal" data-modal></dialog>
<noscript><p class="noscript">O painel precisa do JavaScript ativado.</p></noscript>
</body>
</html>
