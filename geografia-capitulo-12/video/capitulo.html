<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capítulo 12 em vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Capítulo 12 em vídeo — continuação do cabeçalho (1920×1080, 30 fps).
   Moldura fixa nos cantos (escola, professor, componente, alunos) e o
   conteúdo no centro. Paleta laranja: preto quente, laranja, âmbar, brasa, creme. */
:root {
  --bg: #0a0604;
  --orange: #ff7a1a;
  --amber: #ffb24d;
  --ember: #ff4d12;
  --cream: #fff1e2;
  --mute: #c9a88e;
  --dim: #8a6a55;
  --line: rgba(255, 150, 80, .22);
  --panel: rgba(30, 14, 6, .72);
  --f-display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --f-serif: "Instrument Serif", Georgia, serif;
  --f-body: "Manrope", system-ui, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; transform-origin: 0 0; font-family: var(--f-body); color: var(--cream); -webkit-font-smoothing: antialiased; }
.orb { position: absolute; width: 1150px; height: 1150px; border-radius: 50%; filter: blur(90px); }
#orbA { background: radial-gradient(circle, rgba(255, 112, 30, .5), transparent 62%); }
#orbB { background: radial-gradient(circle, rgba(255, 64, 12, .4), transparent 62%); }
#orbC { width: 900px; height: 900px; background: radial-gradient(circle, rgba(255, 178, 77, .26), transparent 64%); }
#topo { position: absolute; inset: -40px; background-size: cover; mix-blend-mode: screen; opacity: .12; }
canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#pins { position: absolute; inset: 0; }
.pin { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(0,0,0,.4), 0 0 18px var(--orange); }
.pin span { position: absolute; left: 22px; top: -10px; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--cream); text-shadow: 0 2px 8px #000, 0 0 3px #000; }
.pin.l span { left: auto; right: 22px; }

/* ---------- moldura fixa (cabeçalho) ---------- */
.block { position: absolute; display: grid; gap: 8px; white-space: nowrap; }
.block .k { font-family: var(--f-mono); font-size: 16px; font-weight: 600; letter-spacing: .38em; text-transform: uppercase; color: var(--orange); }
.block .v { font-family: var(--f-display); font-size: 48px; font-weight: 740; letter-spacing: -.025em; line-height: 1; font-variation-settings: "wdth" 86; }
.block .v .s { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; color: var(--amber); font-size: 1.1em; }
#bSchool { left: 96px; top: 64px; transform-origin: 0 0; }
#bProf { right: 96px; top: 64px; justify-items: end; text-align: right; transform-origin: 100% 0; }
#bComp { left: 96px; bottom: 66px; transform-origin: 0 100%; }
#bAlunos { right: 96px; bottom: 66px; justify-items: end; transform-origin: 100% 100%; }
.stack { display: grid; gap: 7px; justify-items: end; }
.slab { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-width: 220px; padding: 8px 16px 8px 18px; border-radius: 11px; background: linear-gradient(180deg, #2b1508, #120804); border: 1px solid rgba(255, 122, 26, .6); box-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 18px rgba(255, 122, 26, .2); font-family: var(--f-display); font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
.slab i { font-style: normal; font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .2em; color: var(--orange); }
#alLine { position: absolute; right: 96px; bottom: 40px; display: grid; gap: 5px; justify-items: end; white-space: nowrap; }
#alLine .k { font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .38em; color: var(--orange); }
#alLine .v { font-family: var(--f-display); font-size: 27px; font-weight: 720; letter-spacing: -.02em; line-height: 1; }
#alLine .v b { color: var(--orange); font-weight: 600; padding: 0 .25em; }
#ruleT, #ruleB { position: absolute; left: 96px; right: 96px; height: 1px; background: linear-gradient(90deg, transparent, var(--orange) 18%, var(--amber) 50%, var(--orange) 82%, transparent); }
#ruleB { top: 962px; }
#progress { position: absolute; left: 96px; top: 961px; height: 3px; width: 0; background: var(--amber); box-shadow: 0 0 12px var(--orange); border-radius: 2px; }
.rpill { position: absolute; left: 50%; padding: 7px 20px; border-radius: 999px; border: 1px solid rgba(255, 122, 26, .7); background: #120804; font-family: var(--f-mono); font-size: 15px; font-weight: 600; letter-spacing: .3em; color: var(--amber); box-shadow: 0 0 22px rgba(255, 122, 26, .3); white-space: nowrap; text-transform: uppercase; }
#pillB { top: 962px; transform: translate(-50%, -50%); color: var(--mute); font-size: 13px; letter-spacing: .2em; }
.tick { position: absolute; width: 22px; height: 22px; border-color: rgba(255, 140, 50, .7); border-style: solid; border-width: 0; }
#htitle { position: absolute; left: 0; right: 0; top: 300px; display: grid; justify-items: center; gap: 30px; text-align: center; }
#htitle .k { font-family: var(--f-mono); font-size: 17px; font-weight: 600; text-transform: uppercase; color: var(--mute); letter-spacing: .5em; }
#htitle h1 { margin: 0; font-family: var(--f-display); font-size: 148px; font-weight: 800; line-height: .86; letter-spacing: -.045em; text-transform: uppercase; font-variation-settings: "wdth" 78; display: grid; justify-items: center; }
#htitle .hl1 { color: var(--amber); text-shadow: 0 0 18px rgba(255,178,77,.55), 0 0 60px rgba(255,178,77,.28); }
#htitle .hl2 { color: var(--orange); text-shadow: 0 0 18px rgba(255,122,26,.55), 0 0 60px rgba(255,122,26,.28); }

/* ---------- cenas ---------- */
.sc { position: absolute; left: 140px; right: 140px; top: 168px; bottom: 140px; display: none; }
.sc.on { display: block; }
.fill { position: absolute; inset: 0; }
.row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.col { display: grid; gap: 22px; align-content: center; }
.g2 { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
.g2.wl { grid-template-columns: 1.2fr 1fr; }
.g2.wr { grid-template-columns: 1fr 1.25fr; }
.center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 26px; }
.eye { font-family: var(--f-mono); font-size: 17px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--orange); display: inline-flex; gap: 14px; align-items: center; }
.eye::before { content: ""; width: 44px; height: 1px; background: currentColor; }
.center .eye::after { content: ""; width: 44px; height: 1px; background: currentColor; }
.h1 { font-family: var(--f-display); font-size: 92px; font-weight: 760; line-height: .95; letter-spacing: -.035em; font-variation-settings: "wdth" 84; margin: 0; }
.hx { font-family: var(--f-display); font-size: 150px; font-weight: 800; line-height: .88; letter-spacing: -.045em; font-variation-settings: "wdth" 78; margin: 0; text-transform: uppercase; }
.h2 { font-family: var(--f-display); font-size: 62px; font-weight: 720; line-height: 1; letter-spacing: -.03em; font-variation-settings: "wdth" 86; margin: 0; }
.h3 { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.serif { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; color: var(--amber); }
.acc { color: var(--orange); }
.amb { color: var(--amber); }
.lead { font-size: 32px; line-height: 1.42; color: var(--mute); max-width: 34ch; margin: 0; }
.lead b, .txt b, li b { color: var(--cream); font-weight: 700; }
.txt { font-size: 27px; line-height: 1.45; color: var(--mute); margin: 0; }
.small { font-size: 20px; line-height: 1.4; color: var(--dim); margin: 0; }
.src { font-family: var(--f-mono); font-size: 14px; letter-spacing: .06em; color: var(--dim); margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255, 150, 80, .45); background: rgba(30, 14, 6, .7); font-size: 24px; font-weight: 600; white-space: nowrap; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
.panel { padding: 30px 34px; border-radius: 26px; border: 1px solid var(--line); background: var(--panel); }
.stat .n { font-family: var(--f-display); font-size: 150px; font-weight: 800; line-height: .85; letter-spacing: -.05em; color: var(--orange); text-shadow: 0 0 40px rgba(255, 122, 26, .45); }
.stat .n small { font-size: .42em; color: var(--cream); letter-spacing: -.02em; text-shadow: none; }
.stat .l { font-size: 24px; color: var(--mute); max-width: 18ch; line-height: 1.35; margin-top: 12px; }
.cards { display: grid; gap: 20px; }
.card { padding: 28px; border-radius: 22px; border: 1px solid rgba(255, 150, 80, .35); background: linear-gradient(180deg, rgba(44, 20, 8, .92), rgba(16, 7, 3, .95)); display: grid; gap: 12px; align-content: start; }
.card svg.ic { width: 52px; height: 52px; fill: none; stroke: var(--orange); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card h3 { font-family: var(--f-display); font-size: 34px; font-weight: 720; margin: 0; letter-spacing: -.02em; }
.card p { font-size: 22px; line-height: 1.4; color: var(--mute); margin: 0; }
.gauge { display: grid; gap: 12px; }
.gauge .lbl { display: flex; justify-content: space-between; gap: 20px; font-size: 24px; color: var(--mute); }
.gauge .lbl b { color: var(--cream); }
.gauge .bar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.gauge .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--amber), var(--orange)); box-shadow: 0 0 16px var(--orange); transform-origin: left; }
.facts { display: grid; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: 260px 1fr; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.fact dt { font-family: var(--f-mono); font-size: 17px; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); }
.fact dd { margin: 0; font-size: 27px; color: var(--cream); line-height: 1.3; }
.fact dd small { display: block; font-size: 21px; color: var(--mute); margin-top: 4px; }
.slabs { display: grid; gap: 14px; perspective: 1200px; }
.slabs .sl { display: grid; grid-template-columns: 52px 1fr; gap: 4px 18px; align-items: center; padding: 18px 26px; border-radius: 18px; background: linear-gradient(180deg, #2b1508, #110703); border: 1px solid rgba(255, 122, 26, .55); box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 22px rgba(255,122,26,.15); }
.slabs .sl b { grid-row: span 2; font-family: var(--f-mono); font-size: 16px; color: var(--orange); }
.slabs .sl strong { font-family: var(--f-display); font-size: 34px; font-weight: 740; letter-spacing: -.02em; }
.slabs .sl small { font-size: 21px; color: var(--mute); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; }
.list li { position: relative; padding-left: 34px; font-size: 27px; line-height: 1.4; color: var(--mute); }
.list li::before { content: ""; position: absolute; left: 0; top: .55em; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
.map { position: relative; width: 980px; aspect-ratio: 2 / 1; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); }
.map img { width: 100%; height: 100%; display: block; filter: sepia(.55) saturate(1.3) hue-rotate(-12deg) brightness(.92); }
.map .band { position: absolute; left: 0; right: 0; background: rgba(255, 122, 26, .32); border-block: 2px solid var(--amber); mix-blend-mode: screen; }
.map .gl { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255, 241, 226, .35); }
.map .gl span { position: absolute; left: 10px; top: -22px; font-family: var(--f-mono); font-size: 14px; color: rgba(255,241,226,.85); text-shadow: 0 1px 3px #000; }
.map .mp { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 3px rgba(0,0,0,.5), 0 0 14px var(--amber); }
.map .mp span { position: absolute; left: 18px; top: -9px; font-size: 18px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
.bandlist { display: grid; gap: 10px; }
.bandlist div { display: flex; gap: 16px; align-items: center; font-family: var(--f-display); font-size: 30px; font-weight: 650; color: var(--dim); }
.bandlist div i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--dim); }
.bandlist div.on { color: var(--cream); }
.bandlist div.on i { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 12px var(--orange); }
.diagram svg { width: 100%; height: auto; display: block; overflow: visible; }
.lay { display: grid; gap: 12px; }
.lay > div { display: grid; grid-template-columns: 130px 1fr; gap: 18px; align-items: center; padding: 16px 20px; border-radius: 18px; border: 1px solid var(--line); background: rgba(30, 14, 6, .6); }
.lay > div b { font-family: var(--f-mono); font-size: 18px; color: var(--orange); }
.lay > div strong { display: block; font-family: var(--f-display); font-size: 32px; font-weight: 720; }
.lay > div small { font-size: 21px; color: var(--mute); line-height: 1.35; }
.lay > div.on { border-color: var(--orange); background: rgba(70, 28, 8, .8); box-shadow: 0 0 26px rgba(255, 122, 26, .25); }
.landscape { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); }
.landscape svg { display: block; width: 100%; height: 100%; }
.pano { position: absolute; inset: 0; overflow: hidden; }
.pano .strip { position: absolute; top: 0; bottom: 0; left: 0; display: flex; gap: 40px; }
.pano .pp { position: relative; width: 1640px; height: 100%; flex: none; display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center; }
.meter { display: grid; gap: 8px; }
.meter .bar { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #e6c46a, #c98a3a 50%, #8a4a1c); }
.meter .bar i { position: absolute; top: -8px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 4px var(--orange), 0 0 18px var(--orange); }
.meter .ends { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.spec { position: relative; height: 150px; }
.spec .track { position: absolute; left: 0; right: 0; top: 70px; height: 16px; border-radius: 99px; background: linear-gradient(90deg, #e6c46a, #c98a3a 50%, #8a4a1c); }
.spec .mk { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 6px; }
.spec .mk span { font-family: var(--f-display); font-size: 24px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: #1a0b04; border: 1px solid rgba(255, 150, 80, .5); white-space: nowrap; }
.spec .mk i { width: 2px; height: 30px; background: var(--orange); }
.spec .mk.low { top: 78px; }
.spec .mk.low { display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; }
.quiz { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 300px; gap: 60px; align-items: center; }
.qq { font-family: var(--f-display); font-size: 54px; font-weight: 720; line-height: 1.08; letter-spacing: -.025em; margin: 0 0 30px; }
.opts { display: grid; gap: 14px; }
.opt { display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: center; padding: 16px 22px; border-radius: 18px; border: 1px solid rgba(255, 150, 80, .35); background: rgba(30, 14, 6, .7); font-size: 27px; line-height: 1.3; }
.opt b { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; border: 1px solid rgba(255, 150, 80, .5); font-family: var(--f-mono); font-size: 22px; }
.opt.right { border-color: var(--amber); background: rgba(255, 140, 40, .22); box-shadow: 0 0 30px rgba(255, 122, 26, .35); }
.opt.right b { background: var(--amber); color: #1a0800; border-color: var(--amber); }
.opt.dim { opacity: .35; }
.ring { width: 260px; height: 260px; }
.ring circle { fill: none; stroke-width: 14; }
.ring .bg { stroke: rgba(255,255,255,.08); }
.ring .fg { stroke: var(--orange); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 10px var(--orange)); }
.ring text { fill: var(--cream); font-family: var(--f-display); font-weight: 800; font-size: 96px; }
.exp { margin-top: 26px; padding: 20px 26px; border-left: 4px solid var(--amber); border-radius: 14px; background: rgba(255, 140, 40, .08); font-size: 25px; line-height: 1.45; color: var(--mute); }
.exp b { color: var(--cream); }
.ch, .wd { display: inline-block; white-space: pre; }
#flash { position: absolute; inset: 0; background: #ff5a1a; mix-blend-mode: screen; opacity: 0; }
#grain { position: absolute; inset: -60px; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vig { position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 45%, transparent 52%, rgba(0, 0, 0, .62) 100%); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>

<div id="stage">
  <div class="orb" id="orbA"></div><div class="orb" id="orbB"></div><div class="orb" id="orbC"></div>

  <!-- moldura (continua do cabeçalho) -->

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, d) => clamp((t - a) / d);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeBack = (k) => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rng = (seed) => { let s = seed % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const ic = (id) => `<svg class="ic"><use href="#i-${id}"/></svg>`;

function landscape(type, w = 800, h = 450) {
  const r = rng(type.split("").reduce((a, c) => a + c.charCodeAt(0) * 31, 7));
  const id = "sky" + type;
  let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c0a04"/><stop offset=".5" stop-color="#8a3412"/><stop offset=".82" stop-color="#e8702a"/><stop offset="1" stop-color="#ffc070"/></linearGradient></defs>`;
  s += `<rect width="${w}" height="${h}" fill="url(#${id})"/>`;
  s += `<circle cx="${w * (0.3 + r() * 0.4)}" cy="${h * 0.66}" r="${h * 0.14}" fill="#ffd9a0" opacity=".9"/>`;
  const hz = h * 0.72;
  const hills = (y, amp, col, op) => { let d = `M0 ${h} L0 ${y}`; for (let x = 0; x <= w; x += 40) d += ` L${x} ${(y - amp * (0.5 + 0.5 * Math.sin(x / 90 + r() * 0.6))).toFixed(1)}`; return `<path d="${d} L${w} ${h}Z" fill="${col}" opacity="${op}"/>`; };
  const grass = (n, y0, y1, hmin, hmax, col) => { let d = ""; for (let i = 0; i < n; i++) { const x = r() * w, y = lerp(y0, y1, r()), hh = lerp(hmin, hmax, r()), lean = (r() - 0.5) * hh * 0.5; d += `M${x.toFixed(1)} ${y.toFixed(1)} q${(lean * 0.3).toFixed(1)} ${(-hh * 0.6).toFixed(1)} ${lean.toFixed(1)} ${(-hh).toFixed(1)} `; } return `<path d="${d}" stroke="${col}" stroke-width="2" fill="none" stroke-linecap="round"/>`; };
  const ground = (y) => `<rect x="0" y="${y}" width="${w}" height="${h - y}" fill="#140703"/>`;
  const acacia = (x, y, sc) => `<path d="M${x} ${y} C ${x - 4 * sc} ${y - 30 * sc}, ${x + 6 * sc} ${y - 50 * sc}, ${x - 2 * sc} ${y - 70 * sc} M${x - 1 * sc} ${y - 50 * sc} L${x + 26 * sc} ${y - 72 * sc} M${x} ${y - 46 * sc} L${x - 24 * sc} ${y - 70 * sc}" stroke="#140703" stroke-width="${5 * sc}" fill="none" stroke-linecap="round"/><ellipse cx="${x}" cy="${y - 76 * sc}" rx="${62 * sc}" ry="${12 * sc}" fill="#140703"/><ellipse cx="${x + 20 * sc}" cy="${y - 84 * sc}" rx="${36 * sc}" ry="${8 * sc}" fill="#140703"/>`;
  const shrub = (x, y, sc) => { let c = ""; for (let i = 0; i < 6; i++) c += `<circle cx="${(x + (r() - 0.5) * 40 * sc).toFixed(1)}" cy="${(y - r() * 22 * sc).toFixed(1)}" r="${((10 + r() * 12) * sc).toFixed(1)}" fill="#140703"/>`; return c; };
  const saguaro = (x, y, sc, arms = 2) => { let d = `M${x} ${y} V${y - 120 * sc}`; if (arms > 0) d += ` M${x} ${y - 55 * sc} h${-22 * sc} v${-34 * sc}`; if (arms > 1) d += ` M${x} ${y - 70 * sc} h${20 * sc} v${-30 * sc}`; if (arms > 2) d += ` M${x} ${y - 40 * sc} h${16 * sc} v${-22 * sc}`; return `<path d="${d}" stroke="#140703" stroke-width="${14 * sc}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; };
  const twisted = (x, y, sc) => `<path d="M${x} ${y} C ${x + 14 * sc} ${y - 20 * sc}, ${x - 16 * sc} ${y - 40 * sc}, ${x + 6 * sc} ${y - 62 * sc} M${x + 2 * sc} ${y - 40 * sc} C ${x + 18 * sc} ${y - 48 * sc}, ${x + 22 * sc} ${y - 58 * sc}, ${x + 30 * sc} ${y - 66 * sc}" stroke="#140703" stroke-width="${6 * sc}" fill="none" stroke-linecap="round"/>` + shrub(x + 8 * sc, y - 64 * sc, sc * 0.9);
  const thorny = (x, y, sc) => { let d = ""; for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (r() - 0.5) * 1.6, l = (30 + r() * 30) * sc; d += `M${x} ${y} l${(Math.cos(a) * l).toFixed(1)} ${(Math.sin(a) * l).toFixed(1)} `; } return `<path d="${d}" stroke="#140703" stroke-width="${3 * sc}" fill="none" stroke-linecap="round"/>`; };
  if (type === "savana" || type === "cerrado") {
    s += hills(hz - 10, 14, "#5a2310", 0.75) + ground(hz) + grass(220, hz, h, 10, 26, "#2a1006");
    if (type === "savana") { s += acacia(w * 0.22, hz + 6, 1.4) + acacia(w * 0.62, hz + 2, 1.0) + acacia(w * 0.85, hz + 4, 0.7); }
    else { for (let i = 0; i < 6; i++) s += twisted(w * (0.08 + i * 0.16 + r() * 0.05), hz + 4 + r() * 20, 0.9 + r() * 0.5); }
  } else if (type === "pradaria" || type === "pampa") {
    s += hills(hz - 20, 30, "#6a2a12", 0.8) + hills(hz + 10, 24, "#2a1006", 1) + grass(520, hz, h, 18, 44, "#120603");
    if (type === "pampa") { let d = ""; for (let i = 0; i < 9; i++) d += `M${60 + i * 80} ${hz + 40} v-30 `; s += `<path d="${d} M60 ${hz + 22} H${60 + 8 * 80}" stroke="#140703" stroke-width="4"/>`; }
  } else if (type === "estepe") {
    s += `<path d="M0 ${hz} L120 ${hz - 70} L210 ${hz - 30} L330 ${hz - 110} L460 ${hz - 40} L560 ${hz - 80} L700 ${hz - 20} L${w} ${hz - 50} L${w} ${hz}Z" fill="#5a2310" opacity=".7"/>` + ground(hz) + grass(160, hz + 4, h, 6, 14, "#3a1608");
  } else if (type === "mediterranea") {
    s += `<rect x="0" y="${hz - 18}" width="${w}" height="26" fill="#ffc888" opacity=".45"/>` + hills(hz + 30, 26, "#140703", 1);
    for (let i = 0; i < 16; i++) { const x = (i + r() * 0.6) * (w / 16); s += shrub(x, hz + 18 + Math.sin(x / 90) * 8, 0.9 + r() * 0.9); }
    s += `<path d="M${w * 0.7} ${hz + 20} c -4 -30 6 -50 -2 -78" stroke="#140703" stroke-width="7" fill="none"/>` + shrub(w * 0.7, hz - 50, 2.1);
  } else if (type === "deserto") {
    s += hills(hz, 30, "#7a3214", 0.75) + hills(hz + 30, 22, "#1a0904", 1) + saguaro(w * 0.2, hz + 50, 1.3, 2) + saguaro(w * 0.68, hz + 40, 0.9, 1) + saguaro(w * 0.86, hz + 46, 0.7, 2);
  } else if (type === "caatinga") {
    s += hills(hz, 18, "#6a2a12", 0.7) + ground(hz + 6) + grass(60, hz + 6, h, 6, 12, "#3a1608");
    for (let i = 0; i < 7; i++) s += thorny(w * (0.06 + i * 0.14), hz + 30 + r() * 30, 0.9 + r() * 0.6);
    s += saguaro(w * 0.5, hz + 60, 1.0, 3);
  }
  return s + "</svg>";
}

  // --- capítulo ---
  const CH = { s01: [[50, 57, 61, 64, 69], [47, 54, 59, 62, 66], [43, 50, 55, 59, 62], [45, 52, 57, 61, 64]], s02: [[50, 57, 62, 66, 69], [47, 54, 59, 62, 66], [43, 50, 55, 59, 62], [45, 52, 57, 61, 64]], s03: [[38, 45, 50, 57, 62], [41, 48, 53, 57, 60], [36, 43, 48, 55, 60]], s04: [[38, 45, 52, 57], [36, 43, 50, 55], [41, 48, 55, 60]], s05: [[48, 55, 60, 64, 67], [45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62]], s06: [[43, 50, 57, 62, 66], [45, 52, 57, 64], [40, 47, 55, 59, 62]], s07: [[38, 45, 48, 53], [37, 44, 49, 52], [34, 41, 46, 50]], s07r: [[48, 55, 62, 64, 67], [53, 60, 65, 69, 72], [45, 52, 59, 64, 67]], s08: [[48, 55, 60, 64], [45, 52, 57, 64], [41, 48, 57, 60], [43, 50, 55, 62]], fim: [[50, 57, 61, 64, 69], [47, 54, 57, 62, 66], [43, 50, 55, 59, 62, 66], [45, 52, 57, 61, 64, 69]] };

      else if (s.fx === "snow") whoosh(t0 - 0.3, 1.6, 160, 900, 0.26, -0.5, 0.5);

    if (s.sfx === "shimmer") shimmer(t0 + 0.4, 0.08);

window.renderFrame = frame;
window.renderAudio = renderAudio;
window.audioChunk = audioChunk;
window.VIDEO = { FPS, DUR: TOTAL, HEAD, scenes: SCENES.map((x) => ({ id: x.id, start: x.start, dur: x.dur })) };

if (!/render/.test(location.search)) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $("#stage").style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; };
  addEventListener("resize", fit); fit();
  const q = new URLSearchParams(location.search), start = Number(q.get("t") || 0);
