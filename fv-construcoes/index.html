    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('fonts/archivo-variable-latin.woff2') format('woff2-variations'),
          url('fonts/archivo-variable-latin.woff2') format('woff2');

        font-stretch: 62% 125%;
        font-style: normal;
        font-display: swap;
      }
      /* Métricas próximas da Archivo para reduzir o deslocamento na troca de fonte */
      @font-face {
        font-family: 'Archivo Fallback';
        src: local('Arial');
        size-adjust: 103%;
        ascent-override: 88%;
        descent-override: 22%;
      }

    <script>
      // Habilita animações apenas com JS; se o app não iniciar em 4s, o conteúdo aparece mesmo assim.
      document.documentElement.classList.replace('no-js', 'js');
      setTimeout(function () {
        if (!window.__fvReady) document.documentElement.classList.add('reveal-fallback');
      }, 4000);
