<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada — Thiago Liro</title>
  <link rel="icon" href="/tl.ico" sizes="32x32" />
  <link rel="icon" href="/tl.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/tl-180.png" />
  <style>
    @font-face { font-family: "Inter Tight"; font-style: normal; font-display: swap; font-weight: 100 900; src: url("/fonts/inter-tight-latin-wght-normal.woff2") format("woff2"); }
    @font-face { font-family: "Sacramento"; font-style: normal; font-display: block; font-weight: 400; src: url("/fonts/sacramento-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Playfair Display"; font-style: normal; font-display: block; font-weight: 400 900; src: url("/fonts/playfair-display-latin-wght-normal.woff2") format("woff2"); }
    @font-face { font-family: "Newsreader"; font-style: normal; font-display: swap; font-weight: 200 800; src: url("/fonts/newsreader-latin-wght-normal.woff2") format("woff2"); }
    :root { --ink: #1d211b; }
    .brand { display: inline-flex; align-items: baseline; white-space: nowrap; line-height: 1; color: var(--ink); }
    .brand-s { font-family: "Sacramento", "Segoe Script", cursive; font-weight: 400; }
    .brand-tl { font-family: "Playfair Display", Georgia, serif; font-size: 1.3em; font-weight: 500; letter-spacing: -0.13em; margin: 0 0.2em 0 0.14em; background: linear-gradient(180deg, #5a8a4a 0%, #416734 55%, #2f4f26 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card .brand { font-size: 34px; margin-bottom: 18px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: url("/assets/casa-1280.webp") 72% 100% / cover no-repeat, linear-gradient(180deg, #86c9d1, #ebe3cf); color: var(--ink); font: 16px/1.5 "Inter Tight", system-ui, sans-serif; }
    .card { max-width: 440px; padding: 32px; border-radius: 22px; background: rgba(250, 248, 243, 0.9); border: 1px solid rgba(255, 255, 255, 0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-align: center; box-shadow: 0 30px 80px rgba(20, 34, 24, 0.25); }
    small { letter-spacing: 0.24em; text-transform: uppercase; color: #8a6227; font-weight: 600; font-size: 12px; }
    h1 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1.1; margin: 10px 0; }
    p { color: rgba(29, 33, 27, 0.72); margin: 0 0 22px; }
    a { display: inline-block; padding: 13px 22px; border-radius: 999px; background: linear-gradient(180deg, #4f7d41 0%, #416734 55%, #385b2d 100%); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div role="img" aria-label="Thiago Liro"><span class="brand" aria-hidden="true"><span class="brand-s">Thiago</span><span class="brand-tl">TL</span><span class="brand-s">Liro</span></span></div>
    <small>Erro 404</small>
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado ou o imóvel saiu do site. Veja os imóveis disponíveis agora.</p>

  </main>
</body>
</html>
