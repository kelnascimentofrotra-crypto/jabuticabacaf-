<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morada — Casas selecionadas</title>
  <link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/casa.webp" as="image" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar reveal" style="--d: 1.1s">
    <a class="logo" href="#" aria-label="Morada — início">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </span>
      <span class="logo-word">morada</span>
    </a>

    <nav class="nav-pill" aria-label="Principal">
      <a href="#" class="is-active" aria-current="page">Início</a>
      <a href="#">Móveis</a>
      <a href="#">Curadoria</a>
    </nav>

    <div class="actions">
      <button class="icon-btn" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Minha conta">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4.8 20c.9-3.6 3.7-5.6 7.2-5.6s6.3 2 7.2 5.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <a class="contact" href="#">Contato</a>
      <button class="menu-btn" type="button" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="intro reveal" style="--d: 1.25s">
        <p class="tags">Arquitetura <i>•</i> Localização <i>•</i> Essência</p>
        <p class="lead">Projetos autorais em endereços que fazem sentido — casas pensadas para durar.</p>
      </div>

      <h1 class="title" aria-label="Morada">
        <span aria-hidden="true" style="--i: 0">M</span><span aria-hidden="true" style="--i: 1">o</span><span aria-hidden="true" style="--i: 2">r</span><span aria-hidden="true" style="--i: 3">a</span><span aria-hidden="true" style="--i: 4">d</span><span aria-hidden="true" style="--i: 5">a</span>
      </h1>

      <div class="social-row reveal" style="--d: 1.4s">
        <ul class="social" aria-label="Redes sociais">
          <li><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.1" cy="6.9" r="1.2" fill="currentColor"/></svg></a></li>
          <li><a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M13.6 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.9v3h2.6V21z" fill="currentColor"/></svg></a></li>
          <li><a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="1.8" y="4.8" width="20.4" height="14.4" rx="4.2" fill="currentColor"/><path d="m10 9 5.2 3-5.2 3z" fill="var(--bg)"/></svg></a></li>
          <li><a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4.4 9h3.3v11H4.4zM6.05 3.6a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8M9.9 9h3.15v1.5h.05c.44-.84 1.52-1.73 3.13-1.73 3.35 0 3.97 2.2 3.97 5.07V20h-3.29v-5.27c0-1.26-.02-2.87-1.75-2.87-1.75 0-2.02 1.37-2.02 2.78V20H9.9z" fill="currentColor"/></svg></a></li>
        </ul>
        <span class="divider" aria-hidden="true"></span>
        <ul class="people" aria-label="Nossos corretores">
          <li><img src="https://i.pravatar.cc/120?img=47" alt="" onerror="this.remove()" /></li>
          <li><img src="https://i.pravatar.cc/120?img=12" alt="" onerror="this.remove()" /></li>
          <li><img src="https://i.pravatar.cc/120?img=32" alt="" onerror="this.remove()" /></li>
        </ul>
      </div>

      <div class="media">
        <div class="sky" aria-hidden="true"></div>
        <!-- A mesma foto em duas camadas: uma presa ao card, outra só com o que passa do topo (telhado sobre o "Morada"). -->
        <div class="house house--in"><img src="assets/casa.webp" alt="Casa térrea com laje de concreto, pilar de pedra, jardim tropical e piscina" /></div>
        <div class="house house--out" aria-hidden="true"><img src="assets/casa.webp" alt="" /></div>

        <div class="badge reveal" style="--d: 1.6s">
          <svg class="sparkle" viewBox="0 0 32 32" aria-hidden="true">
            <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
              <path d="M16 2v28M2 16h28M6.1 6.1l19.8 19.8M25.9 6.1 6.1 25.9M10.6 3.1l10.8 25.8M3.1 21.4l25.8-10.8M3.1 10.6l25.8 10.8M21.4 3.1 10.6 28.9"/>
            </g>
          </svg>
          <p>Casas selecionadas para<br />um jeito único de viver</p>
        </div>

        <div class="cards">
          <div class="card card--stats reveal" style="--d: 1.75s">
            <strong>+180</strong>
            <span>imóveis<br />selecionados</span>
            <ul class="thumbs" aria-hidden="true">
              <li style="--pos: 76% 52%"></li>
              <li style="--pos: 55% 62%"></li>
              <li style="--pos: 88% 92%"></li>
            </ul>
          </div>

          <a class="card card--feature reveal" style="--d: 1.9s" href="#">
            <span class="feature-img" aria-hidden="true"></span>
            <strong>Casa Pátio</strong>
            <span>São Paulo</span>
            <span class="arrow-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Parallax leve: a casa e o título se movem em profundidades diferentes com o mouse.
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const hero = document.querySelector('.hero');
      let tx = 0, ty = 0, mx = 0, my = 0, raf = 0;
      const tick = () => {
        mx += (tx - mx) * 0.07;
        my += (ty - my) * 0.07;
        hero.style.setProperty('--mx', mx.toFixed(4));
        hero.style.setProperty('--my', my.toFixed(4));
        raf = Math.abs(tx - mx) + Math.abs(ty - my) > 0.0005 ? requestAnimationFrame(tick) : 0;
      };
      const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
      addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        tx = e.clientX / innerWidth - 0.5;
        ty = e.clientY / innerHeight - 0.5;
        kick();
      }, { passive: true });
    })();
  </script>
</body>
</html>
